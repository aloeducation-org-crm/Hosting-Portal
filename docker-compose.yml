services:
  db-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: alo-hosting-panel:builder
    command: ["sh", "-c", "npx prisma db push --skip-generate && chown -R 1001:1001 /var/lib/alo-hosting && npx tsx scripts/bootstrap-super-admin.ts"]
    environment:
      DATABASE_URL: file:/var/lib/alo-hosting/alo.db
    volumes:
      - alo-hosting-data:/var/lib/alo-hosting
    restart: "no"

  alo-hosting-panel:
    build:
      context: .
      dockerfile: Dockerfile
    image: alo-hosting-panel:runtime
    container_name: alo-hosting-panel
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    env_file:
      - path: ./deploy/env/alo-hosting-panel.env
        required: false
    environment:
      NODE_ENV: production
      PORT: "8080"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: file:/var/lib/alo-hosting/alo.db
      CLOUD_DATA_DIR: /var/lib/alo-hosting/cloud-data
      STORAGE_BUCKET_BASE: /var/lib/alo-hosting/storage-buckets
      DEPLOY_RELEASE_BASE: /var/lib/alo-hosting/releases
      DEPLOY_INLINE_WORKER: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - alo-hosting-data:/var/lib/alo-hosting
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/.next/cache:size=256m,uid=1001,gid=1001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  automation-worker:
    image: alo-hosting-panel:runtime
    container_name: alo-automation-worker
    command: ["node", "automation-worker.cjs"]
    depends_on:
      alo-hosting-panel:
        condition: service_healthy
    restart: unless-stopped
    init: true
    env_file:
      - path: ./deploy/env/alo-hosting-panel.env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/var/lib/alo-hosting/alo.db
      CLOUD_DATA_DIR: /var/lib/alo-hosting/cloud-data
      STORAGE_BUCKET_BASE: /var/lib/alo-hosting/storage-buckets
      DEPLOY_RELEASE_BASE: /var/lib/alo-hosting/releases
      DEPLOY_INLINE_WORKER: "false"
      ORCHESTRATOR_HEARTBEAT_FILE: /tmp/alo-automation-worker.json
    volumes:
      - alo-hosting-data:/var/lib/alo-hosting
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 256
    stop_grace_period: 31m
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');const h=JSON.parse(fs.readFileSync(process.env.ORCHESTRATOR_HEARTBEAT_FILE,'utf8'));process.exit(Date.now()-new Date(h.updatedAt).getTime()<60000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  alo-hosting-data:
    name: alo-hosting-data

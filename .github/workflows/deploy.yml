name: Auto Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install & Build & Restart
        working-directory: alo-hosting-portal
        run: |
          npm install
          npx prisma generate
          npx prisma db push --skip-generate
          npm run build
          pm2 restart alo-hosting --update-env || PORT=3051 pm2 start npm --name "alo-hosting" -- start
          pm2 save
          sleep 3
          curl -sf http://127.0.0.1:3051/api/health && echo "✅ Health OK" || echo "❌ Health FAILED"

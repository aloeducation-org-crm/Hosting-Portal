name: Auto Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/projects/Hosting-Portal
            git pull origin main
            cd alo-hosting-portal
            npm install
            npx prisma generate
            npx prisma db push --skip-generate
            npm run build
            pm2 restart alo-hosting --update-env
            pm2 save
            sleep 3
            curl -sf http://127.0.0.1:3051/api/health && echo " ✅ Health OK" || echo " ❌ Health FAILED"

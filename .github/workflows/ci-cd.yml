name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch instead of burning runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default.
permissions:
  contents: read

# ⚠️  DO NOT add a job-level/workflow-level `NODE_ENV: production` here.
# `NODE_ENV=production` makes `npm ci` skip devDependencies, so eslint, typescript
# and tailwindcss are never installed and `npm run lint` dies with exit code 127
# ("eslint: not found"). Production environment values (NODE_ENV, PORT, HOSTNAME)
# belong on the server in the systemd unit / .env file — not in the build pipeline.

jobs:
  lint-and-typecheck:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  build:
    name: Build
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build
        run: npm run build
      - name: Verify standalone output exists
        run: test -f .next/standalone/server.js

  deploy:
    name: Deploy to production
    needs: [lint-and-typecheck, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Fail safe: if the deployment secrets are not configured yet, skip the deploy
      # with a warning instead of failing the whole pipeline red.
      - name: Check deployment prerequisites
        id: preflight
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "::warning::SERVER_HOST / SSH_KEY secrets are not set — skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.preflight.outputs.ready == 'true'
      - name: Deploy to server
        if: steps.preflight.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/app
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            sudo systemctl restart alolabs
            # Smoke test the service locally (port comes from the systemd unit / .env).
            PORT=$(systemctl show -p Environment alolabs | tr ' ' '\n' | sed -n 's/^PORT=//p' | head -1)
            PORT=${PORT:-3101}
            for i in $(seq 1 15); do
              if curl -fsS "http://127.0.0.1:${PORT}/api/health" >/dev/null 2>&1 \
                 || curl -fsS "http://127.0.0.1:${PORT}/api" >/dev/null 2>&1; then
                echo "Health check passed on 127.0.0.1:${PORT}"
                exit 0
              fi
              sleep 2
            done
            echo "Health check FAILED on 127.0.0.1:${PORT}"
            sudo journalctl -u alolabs -n 50 --no-pager
            exit 1

name: CI and production deploy

on:
  push:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: hosting-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, typecheck, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=dev
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    name: Production build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=dev
      - run: npx prisma generate
      - name: Build with non-production CI credentials
        run: npm run build
        env:
          NODE_ENV: production
          NEXTAUTH_URL: http://127.0.0.1:3101
          NEXTAUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef
          JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdef
          APP_ENCRYPTION_KEY: ci-only-not-a-real-key-0123456789abcdef
          DATABASE_URL: file:/tmp/alo-hosting-ci.db
      - name: Check standalone entrypoint
        run: test -s .next/standalone/server.js
      - name: Upload verified release payload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: hosting-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 2
          path: |
            .next/standalone
            .next/static
            public
            prisma
            scripts/init-production-db.sh

  deploy:
    name: Deploy to production server
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hosting-release-${{ github.sha }}
          path: .deploy-artifact
      - name: Activate, restart, and verify
        env:
          DEPLOY_PAYLOAD_DIR: ${{ github.workspace }}/.deploy-artifact
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -e
          export PATH="$HOME/.nvm/versions/node/v24.22.1/bin:$PATH"
          APP_DIR="$HOME/projects/Hosting-Portal"
          cd "$APP_DIR"
          git pull origin main
          cd alo-hosting-portal 2>/dev/null || true
          npm install --production=false
          npx prisma generate
          npx prisma db push --skip-generate || true
          npm run build
          pm2 restart alo-hosting --update-env || PORT=3051 pm2 start npm --name "alo-hosting" -- start
          pm2 save
          sleep 4
          curl -sf http://127.0.0.1:3051/api/health && echo "✅ Deploy OK" || (echo "❌ Health check failed" && exit 1)

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_ENV: production
  PORT: 3101
  HOSTNAME: 127.0.0.1

defaults:
  run:
    working-directory: alo-hosting-portal

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: alo-hosting-portal/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
        continue-on-error: true
      - run: npm run typecheck
        continue-on-error: true

  build:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: alo-hosting-portal/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install & Build & Restart
        working-directory: alo-hosting-portal
        run: |
          npm install
          npx prisma generate
          npx prisma db push --skip-generate
          npm run build
          pm2 restart alo-hosting --update-env || PORT=3051 pm2 start npm --name "alo-hosting" -- start
          pm2 save
          sleep 3
          curl -sf http://127.0.0.1:3051/api/health && echo "✅ Health OK" || echo "❌ Health FAILED"


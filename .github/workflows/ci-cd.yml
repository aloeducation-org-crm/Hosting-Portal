name: CI and production deploy

# Triggers are explicit. A bare `on: push` ran this workflow for every branch
# push in the repository, which wasted CI minutes and made it harder to reason
# about what can reach production. Only main and develop are deployment shapes;
# everything else is verified through its pull request.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # The only supported way to move production backwards. A rollback is refused
  # by scripts/deploy-release.sh unless it is deliberate and attributed, so the
  # intent has to be expressible somewhere: these inputs are chosen at dispatch
  # time by an operator with write access to this repository, which means a
  # rollback cannot be armed permanently by a stored variable someone forgets,
  # and the operator and reason are captured in the rollback audit record.
  #
  # Dispatching from a branch other than main cannot reach production: every
  # deployment job below requires github.ref == 'refs/heads/main', the release
  # guard requires the target to be merged into main, and the payload digest is
  # still verified against what CI built.
  workflow_dispatch:
    inputs:
      allow_rollback:
        description: 'Set to 1 to authorize moving production to an OLDER commit that is merged in main. Leave empty for a normal forward release.'
        required: false
        default: ''
        type: string
      rollback_operator:
        description: 'Who authorized this rollback (recorded in the rollback audit trail).'
        required: false
        default: ''
        type: string
      rollback_reason:
        description: 'Why the newer release must be withdrawn (recorded in the rollback audit trail).'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# CI concurrency is per-ref and cancellable for PRs, so a force-push does not
# leave two runs racing. Production deployment has its own single-flight group
# below — one deploy at a time, never cancelled mid-flight.
concurrency:
  group: hosting-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, typecheck, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Validate all shell scripts parse
        run: |
          set -Eeuo pipefail
          # Matched by shebang as well as by extension: 38 of the shell programs
          # in this repository are the extension-less helpers (`helpers/alo-*`,
          # `server-helpers/alo-*`) that the agents execute on customer servers.
          # A `-name '*.sh'` filter silently checks none of them, so the gate
          # reports green while the highest-privilege scripts go unvalidated.
          failed=0
          checked=0
          while IFS= read -r -d '' file; do
            if [[ "$file" == *.sh ]] || head -n1 "$file" | grep -qE '^#!.*\b(ba|da)?sh\b'; then
              checked=$((checked + 1))
              if ! bash -n "$file" 2>/tmp/shell-syntax-error; then
                echo "::error file=${file}::shell syntax error"
                cat /tmp/shell-syntax-error
                failed=1
              fi
            fi
          done < <(find scripts helpers server-helpers install-scripts deploy agent -type f -print0 2>/dev/null)
          echo "validated ${checked} shell programs"
          # A gate that silently matched nothing would also be green.
          [ "$checked" -ge 40 ] || { echo "::error::only ${checked} shell programs were found; the syntax gate is not covering the repository"; exit 1; }
          exit "$failed"
          find scripts helpers server-helpers install-scripts deploy -type f -name '*.sh' -print0 2>/dev/null \
            | xargs -0 -r -n1 bash -n
      - run: npm ci --include=dev
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    name: Production build
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      artifact-digest: ${{ steps.digest.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=dev
      - run: npx prisma generate
      - name: Build with non-production CI credentials
        run: npm run build
        env:
          NODE_ENV: production
          NEXTAUTH_URL: http://127.0.0.1:3101
          NEXTAUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef
          JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdef
          APP_ENCRYPTION_KEY: ci-only-not-a-real-key-0123456789abcdef0123456789abcdef01234567
          INTERNAL_SECRET: ci-only-not-a-real-internal-0123456789abcdef
          DATABASE_URL: file:/tmp/alo-hosting-ci.db
      - name: Check standalone entrypoint
        run: test -s .next/standalone/server.js
      # The digest travels inside the artifact and is also published as a job
      # output, so the host can prove the payload it received is the payload CI
      # built — and the two values can be compared in the run summary.
      - name: Record release payload digest
        id: digest
        run: |
          set -Eeuo pipefail
          {
            find .next/standalone .next/static public prisma helpers \
                 scripts/init-production-db.sh scripts/apply-deploy-schema.mjs \
                 scripts/deploy-production.sh scripts/deploy-release.sh \
                 scripts/deploy-preflight.sh scripts/decide-release-target.mjs \
                 -type f -print0 2>/dev/null \
              | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1
          } | tee .deploy-digest
          echo "value=$(cat .deploy-digest)" >> "$GITHUB_OUTPUT"
      - name: Upload verified release payload
        # Also on workflow_dispatch against main: that is the authorized-rollback
        # path, and it still deploys the CI-built, digest-verified payload rather
        # than anything built by hand on the host.
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: hosting-release-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
          path: |
            .next/standalone
            .next/static
            public
            prisma
            helpers
            scripts/init-production-db.sh
            scripts/apply-deploy-schema.mjs
            scripts/deploy-production.sh
            scripts/deploy-release.sh
            scripts/deploy-preflight.sh
            scripts/decide-release-target.mjs
            .deploy-digest

  # Read-only. Runs on the production runner BEFORE any approval gate so the
  # approver sees host evidence, and it changes nothing on the host: no checkout,
  # no install into the app directory, no build, no migration, no restart.
  deploy-preflight:
    name: Read-only production preflight
    needs: build
    # push to main is the normal path. workflow_dispatch on main is the only
    # supported way to authorize a rollback; dispatching from any other ref
    # cannot reach production because this condition requires main.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: self-hosted
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      decision: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Installed in the ephemeral workspace only, never in the app checkout.
      - run: npm ci --include=dev
      # Resolved BEFORE the artifact is downloaded. The release payload is large
      # and this runner spent ~5 minutes pulling it on every attempt; an obsolete
      # run should learn it is obsolete in seconds, not after the download. Run
      # #62 attempt 3 failed inside the digest step precisely because a queued
      # run outlived the artifact's 2-day retention and downloaded nothing.
      - name: Refuse to preflight a release that main has already moved past
        env:
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          ALLOW_RELEASE_ROLLBACK: ${{ github.event.inputs.allow_rollback || '' }}
        run: |
          set -Eeuo pipefail
          latest="$(node scripts/latest-main-sha.mjs --ref main)"
          echo "main head is ${latest}; this run carries ${DEPLOY_COMMIT_SHA}"
          if [ "$latest" = "$DEPLOY_COMMIT_SHA" ]; then
            echo "release is the current head of main"
            exit 0
          fi
          # An authorized rollback targets an older commit on purpose, so it is
          # exempt from this one rule and nothing else: scripts/deploy-release.sh
          # still requires the target to be merged in main, still requires the
          # operator and reason, and still verifies the payload digest and the
          # running release afterwards.
          if [ "${ALLOW_RELEASE_ROLLBACK}" = "1" ]; then
            echo "::warning::Rollback authorized: ${DEPLOY_COMMIT_SHA} is not main's head (${latest}). The release guard will still require it to be merged in main and attributed to an operator."
            exit 0
          fi
          echo "::error::Obsolete run: main has moved to ${latest}. Only the current head of main may reach production. Re-run the workflow for ${latest}."
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: hosting-release-${{ github.sha }}
          path: .deploy-artifact
      - name: Verify the artifact digest matches what CI built
        run: |
          set -Eeuo pipefail
          test -f .deploy-artifact/.deploy-digest || { echo "::error::artifact carries no digest"; exit 1; }
          got="$(cat .deploy-artifact/.deploy-digest)"
          want="${{ needs.build.outputs.artifact-digest }}"
          [ "$got" = "$want" ] || { echo "::error::artifact digest mismatch: downloaded $got, CI built $want"; exit 1; }
          echo "artifact digest verified: $got"
      - name: Read-only host preflight
        id: decide
        env:
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          DEPLOY_PAYLOAD_DIR: ${{ github.workspace }}/.deploy-artifact
        run: |
          set -Eeuo pipefail
          APP_DIR="${ALO_INLINE_APP_DIR:-$HOME/projects/Hosting-Portal}"
          if [[ ! -d "$APP_DIR/.git" && -d "$HOME/Hosting-Portal/.git" ]]; then
            APP_DIR="$HOME/Hosting-Portal"
          fi
          if [[ -d "$APP_DIR/.git" ]]; then
            test -f "$APP_DIR/package.json" || { echo "::error::Canonical root package.json is missing"; exit 1; }
            test -f "$APP_DIR/package-lock.json" || { echo "::error::package-lock.json is missing; refusing npm ci"; exit 1; }
            # Delegated to the versioned classifier instead of a bare
            # `git status` test, for two reasons. It tolerates the deployment's
            # own release-identity.json — counting that untracked file as a local
            # change is what blocked runs #54, #58, #60, #62 and #64 in a loop,
            # because the deploy could never pull the commit that ignores it. And
            # it keeps the rule in one reviewable, testable place rather than
            # duplicated here, where a copy can drift from the script's.
            # Genuine uncommitted work still blocks, and is printed by name.
            bash scripts/host-checkout-status.sh "$APP_DIR" \
              || { echo "::error::Production checkout has local changes that are not deployment output. Refusing to checkout or pull and risk overwriting them."; exit 1; }
          elif [[ ! -d "${ALO_HOSTING_ROOT:-$HOME/alo-hosting}" ]]; then
            echo "::error::Canonical production checkout is missing ($HOME/projects/Hosting-Portal or $HOME/Hosting-Portal)"
            exit 1
          fi
          # Decides canonical (promote the CI artifact into an immutable release)
          # versus inline (in place, with capture + additive-only migration +
          # release verification + automatic restore), or blocks. Read-only.
          ALO_INLINE_APP_DIR="$APP_DIR" bash scripts/deploy-preflight.sh
          json="$(ALO_INLINE_APP_DIR="$APP_DIR" bash scripts/deploy-preflight.sh --json)"
          echo "mode=$(node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).decision.mode))' <<<"$json")" >> "$GITHUB_OUTPUT"
          echo "reason=$(node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).decision.reason))' <<<"$json")" >> "$GITHUB_OUTPUT"
      - name: Record when this evidence was collected
        run: date -u +"preflight evidence collected at %Y-%m-%dT%H:%M:%SZ"

  # The only job that changes production. It declares the `production`
  # environment, which is where a required reviewer must be configured so a
  # merge to main cannot deploy unattended. Until that protection rule exists,
  # this job starts immediately — see docs/DEPLOYMENT-AND-ROLLBACK.md, which
  # records the exact administrator action required and why this file cannot
  # create it.
  deploy:
    name: Deploy canonical root portal to production server
    needs: [build, deploy-preflight]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: self-hosted
    environment: production
    timeout-minutes: 30
    # One deployment at a time across every branch and every run, and never
    # cancelled mid-flight: an interrupted deploy is how a host ends up half
    # migrated. The per-ref CI group above cannot provide this.
    concurrency:
      group: hosting-production-deploy
      cancel-in-progress: false
    steps:
      # Full history, not the default depth of 1. The release guard has to prove
      # ancestry relationships — that the target is on main, and whether the
      # running release is ahead of or behind it. In a shallow clone those
      # questions cannot be answered: `git merge-base --is-ancestor` errors out
      # on commits outside the graft, and `git fetch origin main` leaves
      # `origin/main` pointing at this run's own commit, which makes a staleness
      # comparison silently pass for the stale run it exists to reject.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # This job waited in the `hosting-production-deploy` single-flight queue to
      # get here, and a run can sit in that queue for hours (run #62 waited two).
      # Re-check the head of main after acquiring the slot, so a release that was
      # current when the run started cannot be activated after main moved on.
      - name: Re-validate the release against main after acquiring the deploy slot
        env:
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          ALLOW_RELEASE_ROLLBACK: ${{ github.event.inputs.allow_rollback || '' }}
        run: |
          set -Eeuo pipefail
          latest="$(node scripts/latest-main-sha.mjs --ref main)"
          echo "main head is ${latest}; this run carries ${DEPLOY_COMMIT_SHA}"
          if [ "$latest" = "$DEPLOY_COMMIT_SHA" ]; then
            echo "release is still the current head of main after waiting for the deploy slot"
            exit 0
          fi
          if [ "${ALLOW_RELEASE_ROLLBACK}" = "1" ]; then
            echo "::warning::Rollback authorized; skipping the head-of-main requirement. scripts/deploy-release.sh still enforces merged-in-main, attribution and post-activation verification."
            exit 0
          fi
          echo "::error::Superseded release: main has moved to ${latest} while this run waited to deploy. Refusing to activate ${DEPLOY_COMMIT_SHA}."
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: hosting-release-${{ github.sha }}
          path: .deploy-artifact
      - name: Re-verify the artifact digest on the deploying runner
        run: |
          set -Eeuo pipefail
          got="$(cat .deploy-artifact/.deploy-digest)"
          want="${{ needs.build.outputs.artifact-digest }}"
          [ "$got" = "$want" ] || { echo "::error::artifact digest mismatch: downloaded $got, CI built $want"; exit 1; }
      - name: Activate the release, verify the running commit, restore on failure
        env:
          DEPLOY_PAYLOAD_DIR: ${{ github.workspace }}/.deploy-artifact
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          DEPLOY_MODE: ${{ needs.deploy-preflight.outputs.mode }}
          # A backwards deployment is refused unless all three are set. They are
          # deliberately workflow-dispatch inputs rather than repository
          # variables: an operator has to choose them at run time, so a rollback
          # cannot be armed permanently by a config value someone forgets, and
          # the operator and reason land in the rollback audit record.
          ALLOW_RELEASE_ROLLBACK: ${{ github.event.inputs.allow_rollback || '' }}
          RELEASE_ROLLBACK_OPERATOR: ${{ github.event.inputs.rollback_operator || github.actor }}
          RELEASE_ROLLBACK_REASON: ${{ github.event.inputs.rollback_reason || '' }}
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.nvm/versions/node/v24.22.1/bin:$HOME/.nvm/versions/node/v22.0.0/bin:$PATH"
          # All decisions and safety checks live in the versioned script, not in
          # workflow YAML, so they are reviewable and testable:
          #   - refuses to deploy a commit that is not on origin/main
          #   - refuses to pull over local changes
          #   - requires an explicit, absolute database target outside the checkout
          #   - applies ADDITIVE migrations only (a rebuild needs --allow-rebuild
          #     plus a verified backup, run by a human, never by a deploy)
          #   - records a release identity and proves /api/health reports this
          #     exact commit SHA plus database and schema health
          #   - restores the previous commit and re-verifies when that fails
          bash scripts/deploy-release.sh

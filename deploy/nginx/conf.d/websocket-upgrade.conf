# nginx `map` for WebSocket upgrades — must live in the http{} context.
#
# Install (conf.d is included from nginx.conf's http block):
#   sudo cp deploy/nginx/conf.d/websocket-upgrade.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# deploy/nginx/hosting.alolabs.net.conf references $connection_upgrade. Without
# this map nginx fails to start with "unknown connection_upgrade variable".
#
# Why a map and not `proxy_set_header Connection 'upgrade'`: a hardcoded
# "upgrade" is sent on every plain HTTP request too, which breaks keep-alive to
# the upstream and makes long-polling endpoints (log tails, monitoring) hang.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ALO Labs Hosting Panel — nginx site for hosting.alolabs.net
#
# Install:
#   sudo cp deploy/nginx/hosting.alolabs.net.conf /etc/nginx/sites-available/hosting.alolabs.net
#   sudo ln -sfn /etc/nginx/sites-available/hosting.alolabs.net /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificates: obtain with certbot BEFORE relying on the 443 block —
#   sudo certbot --nginx -d hosting.alolabs.net -d www.hosting.alolabs.net
# Requesting both names in ONE certificate is what makes the www → apex
# redirect below usable: certbot names the directory after the first -d, so the
# paths in the 443 blocks stay as written and the SAN list covers both hosts.
# Requesting two separate certificates would put www under its own directory
# and the www block would then need different ssl_certificate paths.
#
# Certbot rewrites this file to add the ssl_certificate lines and the 80→443
# redirect. The copy in git is the pre-certbot shape plus the lines certbot
# adds, so a re-install matches what is already running.
#
# ─────────────────────────────────────────────────────────────────────────────
# www.hosting.alolabs.net NEEDS A DNS RECORD FIRST
#
# Verified 2026-11-14 from a host that can resolve the rest of the internet:
#   hosting.alolabs.net      -> 104.21.34.58 / 2606:4700:3031::ac43:9b20  (Cloudflare)
#   www.hosting.alolabs.net  -> does not resolve
#
# The www blocks below are inert until Cloudflare has a record for the name.
# Add it in Cloudflare → DNS as a proxied CNAME:
#   Type   CNAME   Name   www   Target   hosting.alolabs.net   Proxy   ON
# A proxied CNAME (not "DNS only") keeps the request inside the tunnel and
# reuses the apex certificate. Do not point www at the origin IP directly:
# that bypasses the tunnel and re-opens the redirect loop described below.
#
# ─────────────────────────────────────────────────────────────────────────────
# REQUEST PATH (this is the part that was broken):
#
#   browser → Cloudflare edge → Cloudflare Tunnel (cloudflared)
#           → https://127.0.0.1:443 (this file)
#           → http://127.0.0.1:3051 (Next.js standalone, localhost only)
#
# The tunnel MUST terminate on 443, not 80. If cloudflared's ingress points at
# http://localhost:80, nginx answers with certbot's 301 → https://hosting… ,
# the browser re-requests through Cloudflare, the tunnel hits port 80 again and
# the loop never terminates: the edge returns HTTP 530 / ERR_TOO_MANY_REDIRECTS
# while `curl http://127.0.0.1:3051` on the server looks perfectly healthy.
# See deploy/cloudflared/config.yml.
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP: ACME challenges + redirect ─────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name hosting.alolabs.net www.hosting.alolabs.net;
    server_tokens off;

    # Let's Encrypt HTTP-01 must stay reachable even with the redirect below.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: the real vhost ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hosting.alolabs.net;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/hosting.alolabs.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hosting.alolabs.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/hosting-access.log;
    error_log  /var/log/nginx/hosting-error.log;

    # Server-action payloads and site uploads can be large (next.config.ts sets
    # bodySizeLimit: "50mb"); keep nginx in agreement with the app.
    client_max_body_size 50M;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Immutable build assets ───────────────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3051;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3051;
        proxy_http_version 1.1;

        # WebSocket upgrade (Next.js HMR in dev, live log tails in the panel).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # $scheme is "https" here, which is what NextAuth needs to build correct
        # callback URLs. A literal "https" also works; $scheme is self-correcting.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ── www → apex canonical redirect ────────────────────────────────────────────
# Serving the same app on two hostnames splits cookies, search ranking and
# NextAuth callback URLs, so one name has to win. The apex is the canonical one
# everywhere else in this repository (APP_URL, NEXTAUTH_URL in .env.example).
#
# This block needs the certificate to cover www — see the certbot command at the
# top of this file. Without the SAN, a browser rejects the connection during the
# TLS handshake and never receives the redirect.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.hosting.alolabs.net;
    server_tokens off;

    # Same certificate as the apex: it carries both names as SANs.
    ssl_certificate     /etc/letsencrypt/live/hosting.alolabs.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hosting.alolabs.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/hosting-access.log;
    error_log  /var/log/nginx/hosting-error.log;

    # Covered by the apex's includeSubDomains HSTS header, but a redirecting
    # vhost should still say so for clients that land here before the apex.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        return 301 https://hosting.alolabs.net$request_uri;
    }
}

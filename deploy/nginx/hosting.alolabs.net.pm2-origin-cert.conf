# hosting.alolabs.net on alo-server-lap (103.231.239.79) — PM2 profile.
#
# Request path:
#   browser -> Cloudflare (proxied A record) -> nginx :443 (Cloudflare Origin
#   certificate) -> http://127.0.0.1:3000 (Next.js standalone under PM2)
#
# This is NOT the same shape as deploy/nginx/hosting.alolabs.net.conf, which
# describes the Cloudflare Tunnel + certbot + port 3051 layout. Install only
# one of the two. See docs/PM2-PRODUCTION-RUNBOOK.md.
#
# Install (as root):
#   cp deploy/nginx/hosting.alolabs.net.pm2-origin-cert.conf /etc/nginx/sites-available/hosting.alolabs.net
#   ln -sfn /etc/nginx/sites-available/hosting.alolabs.net /etc/nginx/sites-enabled/hosting.alolabs.net
#   # remove any older `server_name hosting.alolabs.net` block (e.g. in alolabs-all.conf)
#   nginx -t && systemctl reload nginx
#
# Written for nginx 1.18 (Ubuntu 22.04): `listen ... http2` is used because the
# standalone `http2 on;` directive only exists from nginx 1.25.1.
#
# Everything is proxied to Next.js, including /_next/static. Do not add an
# `alias` into /home/alamin: nginx runs as www-data and cannot read it (403).

map $http_upgrade $alo_hosting_connection {
    default upgrade;
    ''      '';
}

# Cloudflare tells the origin which scheme the visitor used. Passing nginx's own
# $scheme would report "http" for every request while Cloudflare is in Flexible
# mode, even though the visitor is on https.
map $http_x_forwarded_proto $alo_hosting_proto {
    default $scheme;
    https   https;
    http    http;
}

# ── Port 80 ──────────────────────────────────────────────────────────────────
# Proxies instead of redirecting. With Cloudflare SSL mode "Flexible",
# Cloudflare talks to the origin on port 80 and a `return 301 https://…` here
# loops forever. Once Cloudflare is set to "Full (strict)" this block is no
# longer on the request path and may be replaced by a redirect.
server {
    listen 80;
    listen [::]:80;
    server_name hosting.alolabs.net;
    server_tokens off;

    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $alo_hosting_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $alo_hosting_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# ── Port 443 ─────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hosting.alolabs.net;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/alolabs.net.pem;
    ssl_certificate_key /etc/nginx/ssl/alolabs.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/hosting-access.log;
    error_log  /var/log/nginx/hosting-error.log;

    # next.config.ts sets bodySizeLimit "50mb"; keep nginx in agreement.
    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $alo_hosting_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $alo_hosting_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_ENV: production
  PORT: 3101
  HOSTNAME: 127.0.0.1

defaults:
  run:
    working-directory: alo-hosting-portal

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: alo-hosting-portal/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
        continue-on-error: true
      - run: npm run typecheck

  build:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: alo-hosting-portal/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/projects/Hosting-Portal
            git pull origin main
            cd alo-hosting-portal
            npm ci
            npx prisma generate
            npx prisma db push --skip-generate
            npm run build
            pm2 restart alo-hosting --update-env
            pm2 save
